# Use after root + compose.site-only.yml. Backups remain on the host, outside Docker data volumes.
services:
  api:
    environment:
      RADAR_MAINTENANCE_STATUS_FILE: /maintenance-state/state.json
    volumes:
      - maintenance_status:/maintenance-state:ro
  maintenance:
    build: .
    image: aihot-app
    command: ["node", "industry/v0.1/maintenance.ts", "run"]
    restart: unless-stopped
    stop_grace_period: 300s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://aihot:${POSTGRES_PASSWORD:-aihot}@db:5432/aihot
      AIHOT_DATA_DIR: /data
      RADAR_MAINTENANCE_STATUS_FILE: /maintenance-state/state.json
      COLLECT_ENABLED: "false"
      MODEL_CALLS_ENABLED: "false"
      FEISHU_CONTENT_PUSH_ENABLED: "false"
      FEISHU_INTERNAL_ENABLED: "false"
      INDEXNOW_SUBMIT_ENABLED: "false"
    volumes:
      - data:/data:ro
      - maintenance_status:/maintenance-state
      - type: bind
        source: ${RADAR_BACKUP_DIR:-./.data/managed-backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "industry/v0.1/maintenance.ts", "status", "--require-healthy"]
      interval: 60s
      timeout: 10s
      start_period: 90s
      retries: 2
volumes:
  maintenance_status: {}
