<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">AgentEval Radar</title>
  <desc id="desc">看懂 Agent 能力，先看评测证据。中文 Agent Evaluation 前沿情报，覆盖评测基准、方法、论文、工具、结果与实践。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d242d"/><stop offset="1" stop-color="#173c43"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#73e0ca" stop-opacity=".02"/><stop offset="1" stop-color="#73e0ca" stop-opacity=".24"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#73e0ca" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="450" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="450" rx="24" fill="url(#grid)"/>
  <g font-family="Arial, 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
    <rect x="56" y="48" width="290" height="28" rx="14" fill="#73e0ca" fill-opacity=".1" stroke="#73e0ca" stroke-opacity=".25"/>
    <circle cx="73" cy="62" r="3" fill="#73e0ca"/>
    <text x="85" y="67" font-size="11" letter-spacing="1.3" fill="#a9efdf">AGENT EVALUATION INTELLIGENCE</text>
    <text x="54" y="143" font-size="57" font-weight="700" letter-spacing="-1.8" fill="#f1f8f6">AgentEval Radar</text>
    <text x="57" y="194" font-size="29" font-weight="600" fill="#d4f4e9">看懂 Agent 能力，先看评测证据。</text>
    <text x="58" y="234" font-size="16" fill="#9abbb9">面向中文 AI 产品经理、评测人员与 Agent 开发者</text>
    <path d="M58 265H664" stroke="#73e0ca" stroke-opacity=".18"/>
    <g font-size="15" fill="#c9ded9" text-anchor="middle">
      <rect x="58" y="287" width="194" height="34" rx="8" fill="#73e0ca" fill-opacity=".08"/><text x="155" y="310">评测基准</text>
      <rect x="264" y="287" width="194" height="34" rx="8" fill="#73e0ca" fill-opacity=".08"/><text x="361" y="310">评测方法</text>
      <rect x="470" y="287" width="194" height="34" rx="8" fill="#73e0ca" fill-opacity=".08"/><text x="567" y="310">论文研究</text>
      <rect x="58" y="331" width="194" height="34" rx="8" fill="#73e0ca" fill-opacity=".08"/><text x="155" y="354">工具框架</text>
      <rect x="264" y="331" width="194" height="34" rx="8" fill="#73e0ca" fill-opacity=".08"/><text x="361" y="354">评测结果</text>
      <rect x="470" y="331" width="194" height="34" rx="8" fill="#73e0ca" fill-opacity=".08"/><text x="567" y="354">实践观点</text>
    </g>
    <text x="58" y="410" font-size="13" letter-spacing="1" fill="#9abbb9">精选看专业价值</text>
    <circle cx="188" cy="405" r="2" fill="#5e8d8c"/>
    <text x="204" y="410" font-size="13" letter-spacing="1" fill="#9abbb9">热门看独立来源热度</text>
  </g>
  <g transform="translate(933 218)">
    <circle r="167" fill="#0d242d" fill-opacity=".5" stroke="#73e0ca" stroke-opacity=".25"/>
    <g fill="none" stroke="#73e0ca">
      <circle r="140" stroke-opacity=".32"/><circle r="94" stroke-opacity=".22"/><circle r="48" stroke-opacity=".18"/>
      <path d="M-167 0H167M0-167V167" stroke-opacity=".19"/>
      <path d="M-118-118 118 118M-118 118 118-118" stroke-opacity=".1"/>
    </g>
    <path d="M0 0 0-140A140 140 0 0 1 99-99Z" fill="url(#sweep)"/>
    <path d="M0 0 99-99" stroke="#73e0ca" stroke-width="5" stroke-linecap="round"/>
    <circle r="8" fill="#73e0ca"/>
    <circle cx="72" cy="64" r="8" fill="#ffcd78"/><circle cx="72" cy="64" r="16" fill="none" stroke="#ffcd78" stroke-opacity=".3"/>
    <circle cx="-68" cy="-53" r="6" fill="#73e0ca"/><circle cx="-68" cy="-53" r="12" fill="none" stroke="#73e0ca" stroke-opacity=".3"/>
    <circle cx="24" cy="-111" r="4" fill="#73e0ca" fill-opacity=".6"/>
    <circle cx="-110" cy="70" r="4" fill="#73e0ca" fill-opacity=".5"/>
  </g>
  <text x="933" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" letter-spacing="3" fill="#9abbb9">EVIDENCE BEFORE HYPE</text>
</svg>
